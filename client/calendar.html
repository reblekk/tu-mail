<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#b90f22" />
<title>Calendar — TU Mail</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/mobile.css" />
<link rel="stylesheet" href="css/mail.css" />
<link rel="stylesheet" href="css/standalone.css" />
<link rel="stylesheet" href="css/features.css" />
<link rel="stylesheet" href="css/calendar.css" />
<link rel="stylesheet" href="css/a11y.css" />
<link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body data-page="calendar">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <main class="main-content mail-main" id="main">
      <div class="page-title">
        <div class="page-title-left">
          <img class="tu-header-logo" src="assets/tu-logo.svg" alt="Technische Universität Darmstadt" width="190" height="74">
          <h2>Calendar</h2>
        </div>
        <div class="profile-menu" id="profile-menu"></div>
      </div>

      <div class="cal-app" id="cal-app">
        <div class="cal-bar">
          <div class="cal-nav">
            <button type="button" class="cal-btn" id="cal-prev" aria-label="Previous">‹</button>
            <button type="button" class="cal-btn" id="cal-today">Today</button>
            <button type="button" class="cal-btn" id="cal-next" aria-label="Next">›</button>
          </div>
          <h3 class="cal-heading" id="cal-heading" aria-live="polite"></h3>
          <div class="cal-actions">
            <div class="cal-views" role="group" aria-label="View">
              <button type="button" class="cal-btn active" id="view-month" aria-pressed="true">Month</button>
              <button type="button" class="cal-btn" id="view-agenda" aria-pressed="false">Agenda</button>
            </div>
            <button type="button" class="cal-btn cal-primary" id="cal-new">New event</button>
            <a class="cal-btn" id="cal-export" href="#" download="calendar.ics">Download calendar</a>
            <a class="cal-btn" href="mail.html" id="cal-mail">Back to mail</a>
          </div>
        </div>
        <p class="cal-error" id="cal-error" role="alert" hidden></p>

        <div class="cal-body">
          <div class="cal-month" id="cal-month">
            <div class="cal-weekdays" id="cal-weekdays" aria-hidden="true"></div>
            <div class="cal-grid" id="cal-grid" role="group" aria-label="Calendar"></div>
          </div>
          <div class="cal-agenda" id="cal-agenda" hidden></div>
          <aside class="cal-day" id="cal-day" aria-label="Selected day">
            <h4 id="cal-day-title"></h4>
            <ul class="cal-day-list" id="cal-day-list"></ul>
            <button type="button" class="cal-btn" id="cal-day-add">Add event on this day</button>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/i18n-de.js"></script>
  <script src="js/ui-prefs.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
