<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TUDa Mail — Sign in</title>
  <meta name="theme-color" content="#b90f22">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/a11y.css">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <img class="university-logo" src="assets/tu-logo.svg" alt="Technische Universität Darmstadt" width="220" height="90">
  </header>
  <main id="main">
    <form id="login">
      <h1 class="brand-title">TUDa Mail</h1>
      <p class="intro">Sign in with your university account.</p>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" spellcheck="false" autocapitalize="none" required>
      <label for="fullname">Full name</label>
      <input id="fullname" name="fullName" type="text" autocomplete="name" maxlength="80" required>
      <p class="field-hint">Shown to recipients as your sender name.</p>
      <label for="username">TU-ID</label>
      <input id="username" name="username" autocomplete="username" spellcheck="false" autocapitalize="none" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="error" role="alert" aria-live="polite"></p>
      <button id="submit" type="submit">Sign in</button>
      <a class="help" href="https://www.hrz.tu-darmstadt.de/support_und_anleitungen/hrz_anleitungen/linux_mailbox/e_mail_einrichten/index.en.jsp" target="_blank" rel="noopener noreferrer">Login help ↗</a>
    </form>
  </main>
  <footer>Independent local mail client · Not an official TU Darmstadt service</footer>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-de.js"></script>
  <script src="js/ui-prefs.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
