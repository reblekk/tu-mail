<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<meta name="theme-color" content="#b90f22" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TU Mail" />
<title>Mail — TU Mail</title>



<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/mobile.css" />
<link rel="stylesheet" href="css/mail.css" />
<link rel="stylesheet" href="css/mail-compose.css" />
<link rel="stylesheet" href="css/mail-cards.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="stylesheet" href="css/standalone.css" />
<link rel="stylesheet" href="css/features.css" />
<link rel="stylesheet" href="css/a11y.css" />
<link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">


    <main class="main-content mail-main" id="main">
      <div class="page-title">
        <div class="page-title-left">
          <img class="tu-header-logo" src="assets/tu-logo.svg" alt="Technische Universität Darmstadt" width="190" height="74">
          <div class="tools-menu" id="tools-menu"></div>
          <!-- Phones only: the header below the page bar is folded into this one (see mail.css). -->
          <button type="button" class="mail-icon-btn phone-only" id="folders-toggle-top" aria-label="Show folders">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <h2><span class="wide-title">Mail</span><span class="phone-title" id="mail-top-title">Inbox</span></h2>
        </div>
        <button type="button" class="mail-icon-btn phone-only" id="mail-refresh-top" aria-label="Sync mailbox" title="Sync mailbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <div class="profile-menu" id="profile-menu"></div>
      </div>

      <!-- Full-area states: first load, "enter your mailbox password", and hard errors. -->
      <div class="mail-state" id="mail-state-loading"><div class="spinner"></div></div>

      <div class="mail-state" id="mail-state-connect" hidden>
        <div class="mail-card">
          <div class="icon-wrap"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
          <h3>Unlock your mailbox</h3>
          <p>Reconnect <strong id="connect-address"></strong> using your TU-ID password.</p>
          <form id="connect-form">
            <input type="email" id="connect-username" autocomplete="username" hidden />
            <div class="field">
              <label for="connect-password">Mailbox password</label>
              <input type="password" id="connect-password" autocomplete="current-password" required />
            </div>
            <div class="form-error" id="connect-error"></div>
            <button type="submit" class="btn btn-primary btn-block" id="connect-submit">Open mailbox</button>
          </form>
        </div>
      </div>

      <div class="mail-state" id="mail-state-error" hidden>
        <div class="mail-card">
          <div class="icon-wrap" style="background:var(--danger-tint);color:var(--danger)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg></div>
          <h3>Can't reach your mailbox</h3>
          <p id="mail-error-text"></p>
          <button type="button" class="btn btn-primary btn-block" id="mail-error-retry">Try again</button>
        </div>
      </div>

      <div class="mail-app" id="mail-app" data-view="list" hidden>
        <aside class="mail-folders" id="mail-folders" aria-label="Folders">
          <div class="mail-folders-head">
            <button type="button" class="btn btn-primary btn-block mail-compose-btn" id="compose-btn-folders">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              New message
            </button>
            <div class="label">Mailbox</div>
            <div class="address" id="mail-address"></div>
          </div>
          <div class="mail-folders-title">
            <span>Folders</span>
            <button type="button" class="mail-icon-btn" id="folder-add" aria-label="New folder" title="New folder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <ul class="mail-folder-list" id="mail-folder-list"></ul>
          <button type="button" class="mail-signature-link" id="mail-settings-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            Signature
          </button>
          
        </aside>
        <div class="mail-scrim" id="mail-scrim"></div>

        <section class="mail-list-pane" aria-label="Message list">
          <div class="mail-list-head">
            <div class="mail-list-title-row">
              <button type="button" class="mail-icon-btn" id="folders-toggle" aria-label="Show folders">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
              </button>
              <h3 id="mail-folder-title">Inbox</h3>
              <button type="button" class="mail-icon-btn" id="compose-btn-list" aria-label="New message" title="New message (C)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
              <button type="button" class="mail-icon-btn" id="mail-refresh" aria-label="Sync mailbox" title="Sync mailbox">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              </button>
            </div>
            <div class="mail-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="search" id="mail-search" placeholder="Search mail" autocomplete="off" />
              <button type="button" class="mail-icon-btn clear" id="mail-search-clear" aria-label="Clear search" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
            <div class="mail-filters">
              <button type="button" class="mail-chip active" id="chip-all">All</button>
              <button type="button" class="mail-chip" id="chip-unread">Unread</button>
              <button type="button" class="mail-chip chip-select" id="chip-select">Select</button>
              <button type="button" class="mail-chip" id="chip-filters" aria-expanded="false" aria-controls="mail-filter-panel">Filters</button>
              <label class="mail-scope" id="scope-wrap"><input type="checkbox" id="scope-all" /> Include message text</label>
            </div>
            <form class="mail-filter-panel" id="mail-filter-panel" hidden>
              <div class="filter-grid">
                <label>From<input type="text" id="flt-from" autocomplete="off" /></label>
                <label>To<input type="text" id="flt-to" autocomplete="off" /></label>
                <label>Subject<input type="text" id="flt-subject" autocomplete="off" /></label>
                <label>After<input type="date" id="flt-since" /></label>
                <label>Before<input type="date" id="flt-before" /></label>
              </div>
              <div class="filter-checks">
                <label><input type="checkbox" id="flt-attach" /> Has attachment</label>
                <label><input type="checkbox" id="flt-flagged" /> Flagged</label>
              </div>
              <div class="filter-actions">
                <button type="submit" class="btn btn-primary btn-sm">Apply filters</button>
                <button type="button" class="btn btn-secondary btn-sm" id="flt-reset">Reset</button>
              </div>
              <div class="saved-searches">
                <div class="saved-head">Saved searches</div>
                <div class="saved-list" id="saved-list"></div>
                <div class="saved-new">
                  <input type="text" id="saved-name" maxlength="40" placeholder="Name this search" aria-label="Name this search" />
                  <button type="button" class="btn btn-secondary btn-sm" id="saved-save">Save this search</button>
                </div>
              </div>
            </form>
            <div class="mail-bulk" id="mail-bulk" hidden>
              <label class="bulk-all"><input type="checkbox" id="bulk-all" /><span id="bulk-count">Select messages</span></label>
              <div class="bulk-actions">
                <button type="button" class="mail-icon-btn" data-bulk="delete" title="Delete" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
                <button type="button" class="mail-icon-btn" data-bulk="archive" title="Archive" aria-label="Archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg></button>
                <button type="button" class="mail-icon-btn" data-bulk="move" title="Move to…" aria-label="Move to folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="m12 11 3 3-3 3"/><path d="M8 14h7"/></svg></button>
                <button type="button" class="mail-icon-btn" data-bulk="spam" title="Spam / not spam" aria-label="Spam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg></button>
                <button type="button" class="mail-icon-btn" data-bulk="read" title="Mark as read" aria-label="Mark as read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.2 8.4c.5.38.8.97.8 1.6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 .8-1.6l8-6a2 2 0 0 1 2.4 0l8 6Z"/><path d="m22 10-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 10"/></svg></button>
                <button type="button" class="mail-icon-btn" data-bulk="unread" title="Mark as unread" aria-label="Mark as unread"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></button>
                <button type="button" class="mail-icon-btn" data-bulk="star" title="Flag / unflag" aria-label="Flag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></button>
              </div>
              <button type="button" class="btn btn-secondary btn-sm" id="bulk-done">Done</button>
            </div>
            <div class="mail-sync" id="mail-sync" hidden role="status" aria-live="polite">
              <div class="mail-sync-text"><span id="mail-sync-label">Syncing conversations</span><b id="mail-sync-pct">0%</b></div>
              <div class="mail-sync-bar"><i id="mail-sync-fill"></i></div>
            </div>
          </div>
          <div class="mail-list-scroll" id="mail-list-scroll">
            <ul class="mail-list" id="mail-list" aria-label="Messages"></ul>
            <div class="mail-more" id="mail-more" hidden></div>
          </div>
        </section>

        <button type="button" class="mail-fab" id="mail-fab" aria-label="New message">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>

        <section class="mail-read-pane" id="mail-read-pane" aria-label="Message">
          <div class="mail-read-empty" id="mail-read-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <div>Select a message to read</div>
          </div>
          <div class="mail-read-body" id="mail-read-body" hidden>
            <div class="msg-toolbar">
              <button type="button" class="mail-icon-btn back-btn" id="msg-back" aria-label="Back to list">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
              </button>
              <button type="button" class="mail-tool" id="msg-delete" title="Delete (Del)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                <span class="label">Delete</span>
              </button>
              <button type="button" class="mail-tool" id="msg-archive" title="Archive (E)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
                <span class="label">Archive</span>
              </button>
              <button type="button" class="mail-tool" id="msg-move" title="Move to folder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="m12 11 3 3-3 3"/><path d="M8 14h7"/></svg>
                <span class="label">Move</span>
              </button>
              <button type="button" class="mail-tool" id="msg-spam" title="Mark as spam">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>
                <span class="label">Spam</span>
              </button>
              <span class="tool-divider"></span>
              <button type="button" class="mail-tool" id="msg-unread">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                <span class="label">Mark unread</span>
              </button>
              <button type="button" class="mail-tool" id="msg-flag">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                <span class="label">Flag</span>
              </button>
              <button type="button" class="mail-tool" id="msg-export" title="Export as .eml (X)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
                <span class="label">Export</span>
              </button>
              <button type="button" class="mail-tool" id="msg-remind" title="Remind me (B)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                <span class="label">Remind me</span>
              </button>
              <button type="button" class="mail-tool" id="msg-print" title="Print message (P)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                <span class="label">Print</span>
              </button>
              <span class="spacer"></span>
            </div>
            <div class="msg-scroll" id="msg-scroll">
              <div id="msg-content"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  

  <script src="js/i18n.js"></script>
  <script src="js/i18n-de.js"></script>
  <script src="js/ui-prefs.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/safety.js"></script>
  <script src="js/undo-send.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mail-app.js"></script>
  <script src="js/mail-cache.js"></script>
  <script src="js/mail-thread.js"></script>
  <script src="js/mail-preview.js"></script>
  <script src="js/mail-organize.js"></script>
  <script src="js/mail-recovery.js"></script>
  <script src="js/mail-compose.js"></script>
  <script src="js/mail-signature.js"></script>
  <script src="js/mail-tools.js"></script>
  <script src="js/mail-search.js"></script>
  <script src="js/identities.js"></script>
  <script src="js/message-tools.js"></script>

</body>
</html>
